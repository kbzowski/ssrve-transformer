[project]
name = "multiphasessrve"
version = "0.1.0"
description = "Encoder-decoder transformer with differentiable Apollonius soft-Voronoi decoder for multiphase microstructure SSRVE generation."
authors = [
    { name = "Krzysztof Bzowski", email = "kbzowski@agh.edu.pl" },
    { name = "Lukasz Rauch", email = "lrauch@agh.edu.pl" },
]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=2.1.3,<2.2.0",
    "pillow>=11.1.0,<12.0.0",
    "numba>=0.61.0,<0.62.0",
    "pydantic>=2.10.6,<3.0.0",
    "scipy>=1.15.2,<2.0.0",
    "h5py>=3.12.1",
    "geomloss>=0.2.6",
    "torch>=2.11.0",
    "tensorboard>=2.20.0",
    "mlflow>=2.17.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2",
    "pandas-stubs>=2.2.3.241126,<3",
]

[tool.uv]
default-groups = "all"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
